name: Build signed Google Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify upload signing secrets exist
        env:
          AQAS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.AQAS_UPLOAD_KEYSTORE_BASE64 }}
          AQAS_UPLOAD_STORE_PASSWORD: ${{ secrets.AQAS_UPLOAD_STORE_PASSWORD }}
          AQAS_UPLOAD_KEY_ALIAS: ${{ secrets.AQAS_UPLOAD_KEY_ALIAS }}
          AQAS_UPLOAD_KEY_PASSWORD: ${{ secrets.AQAS_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$AQAS_UPLOAD_KEYSTORE_BASE64"
          test -n "$AQAS_UPLOAD_STORE_PASSWORD"
          test -n "$AQAS_UPLOAD_KEY_ALIAS"
          test -n "$AQAS_UPLOAD_KEY_PASSWORD"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore private upload keystore
        env:
          AQAS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.AQAS_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/aqas-signing"
          printf '%s' "$AQAS_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aqas-signing/aqas-upload.jks"
          echo "AQAS_UPLOAD_STORE_FILE=$RUNNER_TEMP/aqas-signing/aqas-upload.jks" >> "$GITHUB_ENV"

      - name: Configure signing environment
        env:
          AQAS_UPLOAD_STORE_PASSWORD: ${{ secrets.AQAS_UPLOAD_STORE_PASSWORD }}
          AQAS_UPLOAD_KEY_ALIAS: ${{ secrets.AQAS_UPLOAD_KEY_ALIAS }}
          AQAS_UPLOAD_KEY_PASSWORD: ${{ secrets.AQAS_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "AQAS_UPLOAD_STORE_PASSWORD=$AQAS_UPLOAD_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AQAS_UPLOAD_KEY_ALIAS=$AQAS_UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AQAS_UPLOAD_KEY_PASSWORD=$AQAS_UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter source
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build signed Android App Bundle
        run: flutter build appbundle --release --no-pub

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: LCS-Tracker-by-AQAS-signed-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Remove private keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/aqas-signing/aqas-upload.jks"
