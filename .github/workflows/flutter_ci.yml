name: LCS Flutter Verification Build

on:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - ".github/workflows/flutter_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Google Play upload signing
        env:
          AQAS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.AQAS_UPLOAD_KEYSTORE_BASE64 }}
          AQAS_UPLOAD_STORE_PASSWORD: ${{ secrets.AQAS_UPLOAD_STORE_PASSWORD }}
          AQAS_UPLOAD_KEY_ALIAS: ${{ secrets.AQAS_UPLOAD_KEY_ALIAS }}
          AQAS_UPLOAD_KEY_PASSWORD: ${{ secrets.AQAS_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$AQAS_UPLOAD_KEYSTORE_BASE64" ] || [ -z "$AQAS_UPLOAD_STORE_PASSWORD" ] || [ -z "$AQAS_UPLOAD_KEY_ALIAS" ] || [ -z "$AQAS_UPLOAD_KEY_PASSWORD" ]; then
            echo "::error::Missing existing AQAS upload signing secrets. Check repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          set -euo pipefail
          if ! printf '%s' "$AQAS_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks; then
            echo "::error::AQAS_UPLOAD_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if [ ! -s android/upload-keystore.jks ]; then
            echo "::error::Decoded upload keystore is empty."
            exit 1
          fi
          if ! keytool -list -keystore android/upload-keystore.jks -storepass "$AQAS_UPLOAD_STORE_PASSWORD" -alias "$AQAS_UPLOAD_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Upload keystore, store password, or key alias is invalid. Secret values were not printed."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$AQAS_UPLOAD_STORE_PASSWORD
          keyAlias=$AQAS_UPLOAD_KEY_ALIAS
          keyPassword=$AQAS_UPLOAD_KEY_PASSWORD
          EOF
          echo "Upload keystore decoded and configured; key material was not printed."

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter source
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run LCS status classification tests
        run: flutter test --no-pub

      - name: Build release APK signed with upload key
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Build release Android App Bundle signed with upload key
        run: flutter build appbundle --release --no-pub

      - name: Verify APK and AAB signatures
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "::error::Android SDK path is not configured on this runner."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found under $ANDROID_SDK_ROOT/build-tools. Install Android SDK Build-Tools."
            exit 1
          fi
          echo "Using Android signature verifier: $APKSIGNER"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK and AAB test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lcs-tracker-release-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
