name: LCS Flutter Verification Build

on:
  push:
    branches:
      - main
      - feature/background-sync-v1.0.5
      - feature/lcs-v1.0.8-reports-export
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - ".github/workflows/flutter_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter source
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run LCS status classification tests
        run: flutter test --no-pub

      - name: Build release APK for device testing
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Rename APK with version and update title
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "LCS Tracker By AQAS V.1.0.8 (Backup + CSV Export + Advanced Reports).apk"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: LCS-Tracker-By-AQAS-V1.0.8-Backup-CSV-Advanced-Reports
          path: "LCS Tracker By AQAS V.1.0.8 (Backup + CSV Export + Advanced Reports).apk"
          if-no-files-found: error
          retention-days: 7
